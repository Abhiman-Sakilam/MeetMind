services:
  # ── AI Brain Orchestration ───────────────────────────────────────────────────
  ai-brain:
    build: ./ai-brain-orchestration
    container_name: ai-brain
    ports:
      - "127.0.0.1:8100:8100"
    env_file: ./ai-brain-orchestration/.env
    environment:
      # Redis on the same Docker network — makes brain state survive restarts and
      # stay correct across multiple Uvicorn workers. Non-secret; falls back to
      # pure in-memory if Redis is unreachable.
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (brain state store) ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ai-brain-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── MeetMind Database ────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: meetmind-db
    environment:
      POSTGRES_USER: meetmind
      POSTGRES_PASSWORD: meetmind
      POSTGRES_DB: meetmind
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetmind"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── MeetMind Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./meet-mind/backend
      args:
        # 1 = bundle local Whisper/Coqui (~3GB); 0 = slim image, voice via ElevenLabs
        LOCAL_MODELS: ${LOCAL_MODELS:-0}
    container_name: meetmind-backend
    ports:
      - "8000:8000"
    volumes:
      # Bind mounts persist models on the host — survives rebuilds and docker volume prunes
      - ./model-cache/huggingface:/app/.cache/huggingface
      - ./model-cache/tts:/root/.local/share/tts
    environment:
      - DATABASE_URL=postgresql+asyncpg://meetmind:meetmind@db:5432/meetmind
      - TURN_USERNAME=${TURN_USERNAME:-}
      - TURN_CREDENTIAL=${TURN_CREDENTIAL:-}
      - HF_HOME=/app/.cache/huggingface
      - HF_TOKEN=${HF_TOKEN:-}
      - STT_MODEL_NAME=${STT_MODEL_NAME:-distil-medium.en}
      - STT_DEVICE=${STT_DEVICE:-cpu}
      - STT_COMPUTE_TYPE=${STT_COMPUTE_TYPE:-int8}
      - STT_INITIAL_PROMPT=${STT_INITIAL_PROMPT:-}
      # Brain on same Docker network — use service name
      - AI_BRAIN_BASE_URL=http://ai-brain:8100
      - AI_BRAIN_SERVICE_TOKEN=${AI_BRAIN_SERVICE_TOKEN:-}
      - TTS_MODEL_NAME=${TTS_MODEL_NAME:-tts_models/en/vctk/vits}
      - TTS_DEVICE=${TTS_DEVICE:-cpu}
      # Voice: ElevenLabs when ELEVENLABS_API_KEY is set (STT/TTS_PROVIDER=auto), else local models
      - STT_PROVIDER=${STT_PROVIDER:-auto}
      - TTS_PROVIDER=${TTS_PROVIDER:-auto}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-JBFqnCBsd6RMkjVDRZzb}
      - ELEVENLABS_STT_MODEL=${ELEVENLABS_STT_MODEL:-scribe_v2}
      - ELEVENLABS_TTS_MODEL=${ELEVENLABS_TTS_MODEL:-eleven_flash_v2_5}
      # Auth: JWT signing secret (set in .env). Empty = random per start, logins reset on restart.
      - JWT_SECRET=${JWT_SECRET:-}
      # Google Sign-In: OAuth 2.0 Web client ID (Google Cloud Console). Empty = Google login disabled.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    depends_on:
      ai-brain:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── MeetMind Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./meet-mind/frontend
      network: host
    container_name: meetmind-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
