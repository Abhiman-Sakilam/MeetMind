server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS — re-resolve backend on each request window so
    # proxy_pass does not stick to a stale IP after `docker compose` recreates
    # the backend container (avoids 502 "Connection refused" to old 172.x.x.x).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assistant: STT warmup can exceed 5m on first run (HF download + large Whisper load).
    # Brain execute can also be slow. Keep this block well above typical model download time.
    location /api/assistant/ {
        set $api_upstream backend:8000;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        client_max_body_size 50m;
        proxy_request_buffering off;
    }

    location /api/ {
        set $api_upstream backend:8000;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws/ {
        set $api_upstream backend:8000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
